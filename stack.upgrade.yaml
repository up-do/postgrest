user-message: "WARNING: This stack project is generated."

# When updating, update GHC version in .github/workflows/build.yaml as well.
nix:
  packages:
    - botan3
    - libpq
    - libpq.pg_config
    - pkg-config
    - zlib

allow-newer: true
allow-newer-deps:
  - fuzzyset

resolver: nightly-2026-11-19

# We have 1 package.
packages:
  - ./.

extra-deps:
  # Package versions for published packages either not on Stackage or
  # not matching the version on Stackage for the resolver we use.
  # These package-version extra dependencies are equivalent to cabal constraints.
  - QuickCheck-2.15.0.1
  - botan-bindings-0.3.0.0
  - botan-low-0.2.0.1
  - configurator-pg-0.2.11
  - crypton-1.0.6
  - crypton-x509-1.8.0
  - fuzzyset-0.2.4
  - hspec-wai-0.11.1
  - hspec-wai-json-0.11.0
  - insert-ordered-containers-0.2.7
  - jose-jwt-botan-0.13.0
  - megaparsec-9.7.1
  - postgresql-binary-0.14.2
  - swagger2-2.8.10
